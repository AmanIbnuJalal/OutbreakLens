services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: outbreaklens
      POSTGRES_USER: outbreaklens
      POSTGRES_PASSWORD: outbreaklens
    ports:
      - "5432:5432"
    volumes:
      - outbreaklens-postgres:/var/lib/postgresql/data

volumes:
  outbreaklens-postgres: