services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: outbreaklens
      POSTGRES_USER: outbreaklens
      POSTGRES_PASSWORD: outbreaklens
    ports:
      - "5432:5432"
    volumes:
      - outbreaklens-postgres:/var/lib/postgresql/data

  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "pnpm --filter @workspace/db run push &&
             pnpm --filter @workspace/api-server run seed &&
             pnpm --filter @workspace/api-server run dev"
    environment:
      DATABASE_URL: postgresql://outbreaklens:outbreaklens@postgres:5432/outbreaklens
      PORT: 8080
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "pnpm --filter @workspace/outbreaklens run dev"
    environment:
      PORT: 5173
      BASE_PATH: /
      API_SERVER_URL: http://api-server:8080
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - api-server

volumes:
  outbreaklens-postgres: